<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Analog Circuit Lab - Real-Time Simulator</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrolling, app-like feel */
            user-select: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }

        /* Breadboard Styling */
        #workspace {
            position: relative;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .breadboard-body {
            background-color: #f1f5f9;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.5);
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .hole {
            width: 12px;
            height: 12px;
            background-color: #334155;
            border-radius: 2px;
            margin: 4px;
            cursor: crosshair;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
            transition: all 0.1s;
        }
        .hole:hover {
            background-color: #94a3b8;
            transform: scale(1.2);
        }
        .hole.selected {
            background-color: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
        }

        /* Power Rails */
        .rail-red { border-bottom: 2px solid #ef4444; padding-bottom: 4px; margin-bottom: 8px; }
        .rail-blue { border-top: 2px solid #3b82f6; padding-top: 4px; margin-top: 8px; }

        /* Component Overlay */
        #svg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        
        .component-line {
            stroke-width: 4;
            stroke-linecap: round;
            pointer-events: auto;
            cursor: pointer;
            transition: stroke 0.2s;
        }
        .component-line:hover { stroke: #ef4444 !important; } /* Hover to delete */

        /* CRO Canvas */
        #cro-canvas {
            background-color: #022c22;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            width: 100%;
            height: 200px;
        }

        /* Tool active state */
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="flex h-screen w-screen">

    <div class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col z-30 shadow-xl overflow-y-auto">
        <div class="p-4 border-b border-slate-700">
            <h1 class="text-xl font-bold text-white tracking-tight">Analog Lab</h1>
            <p class="text-xs text-slate-400">Real-Time MNA Engine</p>
        </div>

        <!-- Oscilloscope -->
        <div class="p-4 border-b border-slate-700">
            <h2 class="text-sm font-semibold text-white mb-2 flex items-center justify-between">
                <span>Oscilloscope (CRO)</span>
            </h2>
            <canvas id="cro-canvas" width="300" height="200" class="mb-3"></canvas>
            <div id="cro-reading" class="text-xs font-mono text-center mb-3 bg-slate-900 rounded p-1">0.00V</div>
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <div class="flex justify-between text-xs mb-1 text-slate-400">
                            <label>Time/Div</label>
                            <span id="lbl-time">1.0 ms</span>
                        </div>
                        <input type="range" id="cro-time" min="0.1" max="10" step="0.1" value="1.0">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1 text-slate-400">
                            <label>X-Pos</label>
                            <span id="lbl-xpos">0.0 div</span>
                        </div>
                        <input type="range" id="cro-xpos" min="-5" max="5" step="0.1" value="0">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3 border-t border-slate-700 pt-2">
                    <div>
                        <div class="flex justify-between text-xs mb-1 text-emerald-400">
                            <label>CH1 V/Div</label>
                            <span id="lbl-volt1">2.0 V</span>
                        </div>
                        <input type="range" id="cro-volt1" min="0.1" max="10" step="0.1" value="2.0">
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1 text-yellow-400">
                            <label>CH2 V/Div</label>
                            <span id="lbl-volt2">2.0 V</span>
                        </div>
                        <input type="range" id="cro-volt2" min="0.1" max="10" step="0.1" value="2.0">
                    </div>
                </div>
            </div>
        </div>

        <!-- Function Generator -->
        <div class="p-4 border-b border-slate-700">
            <h2 class="text-sm font-semibold text-blue-400 mb-3">Function Generator</h2>
            <div class="flex bg-slate-900 rounded p-1 mb-4">
                <button class="fg-wave flex-1 py-1 text-xs rounded bg-blue-600 text-white" data-wave="sine">Sine</button>
                <button class="fg-wave flex-1 py-1 text-xs rounded text-slate-400 hover:bg-slate-800" data-wave="square">Square</button>
            </div>
            
            <div class="space-y-3">
                <div>
                    <div class="flex justify-between text-xs mb-1 text-slate-400">
                        <label>Frequency</label>
                        <span id="lbl-freq">1000 Hz</span>
                    </div>
                    <input type="range" id="fg-freq" min="10" max="5000" step="10" value="1000">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1 text-slate-400">
                        <label>Level (V peak)</label>
                        <span id="lbl-level">5.0 V</span>
                    </div>
                    <input type="range" id="fg-level" min="0" max="12" step="0.5" value="5.0">
                </div>
            </div>
        </div>

        <!-- Demos -->
        <div class="p-4">
            <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Load Demos</h2>
            <div class="flex space-x-2">
                <button onclick="loadDemo('rc')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded">RC Low-Pass</button>
                <button onclick="loadDemo('clipper')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded">Diode Clipper</button>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col bg-slate-900">
        
        <!-- Toolbar -->
        <div class="h-16 bg-slate-800 border-b border-slate-700 flex items-center px-4 space-x-4 shadow-md z-30">
            <span class="text-sm font-semibold text-slate-400 mr-2">Components:</span>
            
            <button class="tool-btn active px-3 py-1.5 border border-slate-600 rounded text-sm text-slate-300 hover:bg-slate-700 transition" data-tool="wire">Wire</button>
            
            <div class="flex items-center space-x-1 border border-slate-600 rounded px-2 py-1 bg-slate-900/50">
                <button class="tool-btn px-2 py-0.5 rounded text-sm text-slate-300 hover:bg-slate-700 transition" data-tool="resistor">Resistor</button>
                <input type="number" id="val-resistor" value="1000" class="w-16 bg-slate-800 text-xs text-white border border-slate-600 rounded px-1 py-0.5 text-center">
                <span class="text-xs text-slate-500">Ω</span>
            </div>

            <div class="flex items-center space-x-1 border border-slate-600 rounded px-2 py-1 bg-slate-900/50">
                <button class="tool-btn px-2 py-0.5 rounded text-sm text-slate-300 hover:bg-slate-700 transition" data-tool="capacitor">Capacitor</button>
                <input type="number" id="val-capacitor" value="0.1" class="w-14 bg-slate-800 text-xs text-white border border-slate-600 rounded px-1 py-0.5 text-center">
                <span class="text-xs text-slate-500">µF</span>
            </div>

            <button class="tool-btn px-3 py-1.5 border border-slate-600 rounded text-sm text-slate-300 hover:bg-slate-700 transition" data-tool="diode">Diode</button>
            
            <div class="flex-1"></div>
            
            <span class="text-sm font-semibold text-slate-400 mr-2">Probes:</span>
            <button class="tool-btn px-2 py-1 border border-red-900 bg-red-900/30 rounded text-xs text-red-400 hover:bg-red-900/60" data-tool="fg_plus">FG (+)</button>
            <button class="tool-btn px-2 py-1 border border-slate-600 bg-slate-700 rounded text-xs text-slate-300 hover:bg-slate-600" data-tool="fg_minus">FG (-)</button>
            <button class="tool-btn px-2 py-1 border border-emerald-900 bg-emerald-900/30 rounded text-xs text-emerald-400 hover:bg-emerald-900/60" data-tool="cro_ch1">CH1 (+)</button>
            <button class="tool-btn px-2 py-1 border border-yellow-900 bg-yellow-900/30 rounded text-xs text-yellow-400 hover:bg-yellow-900/60" data-tool="cro_ch2">CH2 (+)</button>
            <button class="tool-btn px-2 py-1 border border-slate-600 bg-slate-700 rounded text-xs text-slate-300 hover:bg-slate-600" data-tool="cro_minus">CRO (-)</button>
            <button class="tool-btn px-2 py-1 border border-slate-500 bg-slate-900 rounded text-xs text-slate-400 hover:bg-slate-700" data-tool="gnd">Earth</button>
            
            <button onclick="clearBoard()" class="ml-4 px-3 py-1.5 bg-red-600 hover:bg-red-500 rounded text-sm text-white transition font-bold shadow">Clear All</button>
        </div>

        <!-- Breadboard Workspace -->
        <div id="workspace" class="flex-1 flex items-center justify-center overflow-auto p-8">
            <svg id="svg-overlay"></svg>
            
            <!-- Breadboard Container Generated by JS -->
            <div class="breadboard-body flex flex-col" id="breadboard-container">
                <!-- Javascript will inject holes here -->
            </div>
            
            <!-- Instruction Overlay -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800/90 text-slate-300 px-6 py-3 rounded-full shadow-lg text-sm flex items-center space-x-2 border border-slate-600 backdrop-blur pointer-events-none">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                <span><strong>Select a tool</strong> above, then <strong>click two holes</strong> to connect them. Click components to delete.</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Breadboard Generation & Logic ---
        const COLS = 25; 
        const bbContainer = document.getElementById('breadboard-container');
        const holesMap = new Map(); // DOM Element -> Node ID
        const nodePositions = new Map(); // DOM Element -> {x,y} for SVG drawing

        let nodeIdCounter = 1;
        
        function createRowHoles(numCols, parent, nodeMappingFunc) {
            const row = document.createElement('div');
            row.className = 'flex justify-between w-full mb-1';
            for(let c=0; c<numCols; c++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                const nodeId = nodeMappingFunc(c);
                hole.dataset.node = nodeId;
                holesMap.set(hole, nodeId);
                
                // Interaction
                hole.addEventListener('click', (e) => handleHoleClick(e, hole, nodeId));
                row.appendChild(hole);
            }
            parent.appendChild(row);
            return row;
        }

        function initBreadboard() {
            // Top Power Rails (Red = Node 1, Blue = Node 2)
            const topRail = document.createElement('div');
            topRail.className = "flex flex-col mb-4 rail-red";
            createRowHoles(COLS, topRail, () => 1); // Red rail all connected
            createRowHoles(COLS, topRail, () => 2); // Blue rail all connected
            bbContainer.appendChild(topRail);

            // Terminal Strips Top Half (Columns A-E)
            // Each column is its own node
            const termTop = document.createElement('div');
            termTop.className = "flex space-x-2 mb-6";
            for(let c=0; c<COLS; c++) {
                const colNode = nodeIdCounter++; // Unique node per column
                const colDiv = document.createElement('div');
                colDiv.className = "flex flex-col bg-slate-300 rounded p-1";
                for(let r=0; r<5; r++) {
                    const hole = document.createElement('div');
                    hole.className = 'hole bg-slate-400';
                    hole.dataset.node = colNode;
                    holesMap.set(hole, colNode);
                    hole.addEventListener('click', (e) => handleHoleClick(e, hole, colNode));
                    colDiv.appendChild(hole);
                }
                termTop.appendChild(colDiv);
            }
            bbContainer.appendChild(termTop);

            // Terminal Strips Bottom Half (Columns F-J)
            const termBot = document.createElement('div');
            termBot.className = "flex space-x-2 mb-4";
            for(let c=0; c<COLS; c++) {
                const colNode = nodeIdCounter++; 
                const colDiv = document.createElement('div');
                colDiv.className = "flex flex-col bg-slate-300 rounded p-1";
                for(let r=0; r<5; r++) {
                    const hole = document.createElement('div');
                    hole.className = 'hole bg-slate-400';
                    hole.dataset.node = colNode;
                    holesMap.set(hole, colNode);
                    hole.addEventListener('click', (e) => handleHoleClick(e, hole, colNode));
                    colDiv.appendChild(hole);
                }
                termBot.appendChild(colDiv);
            }
            bbContainer.appendChild(termBot);

            // Bottom Power Rails (Red = Node 3, Blue = Node 4)
            const botRail = document.createElement('div');
            botRail.className = "flex flex-col rail-blue";
            createRowHoles(COLS, botRail, () => 3); 
            createRowHoles(COLS, botRail, () => 4); 
            bbContainer.appendChild(botRail);
            
            updateNodePositions();
        }

        // Cache positions of holes for drawing components
        function updateNodePositions() {
            const svgRect = document.getElementById('svg-overlay').getBoundingClientRect();
            holesMap.forEach((nodeId, el) => {
                const rect = el.getBoundingClientRect();
                nodePositions.set(el, {
                    x: rect.left - svgRect.left + rect.width / 2,
                    y: rect.top - svgRect.top + rect.height / 2
                });
            });
        }
        window.addEventListener('resize', updateNodePositions);

        // --- 2. Mathematical Simulation Engine (MNA) ---
        
        class AnalogEngine {
            constructor() {
                this.dt = 1e-4; // 100 microseconds per step for audio-freq circuits
                this.time = 0;
                this.maxNodes = 200; // Array size for matrix
                this.components = []; // {id, type, n1, n2, val, el1, el2}
                this.fgNodePlus = null;
                this.fgNodeMinus = null;
                this.croCh1Node = null;
                this.croCh2Node = null;
                this.croMinusNode = null;
                this.gndNodes = new Set();
                this.voltages = new Array(this.maxNodes).fill(0);
            }

            reset() {
                this.time = 0;
                this.voltages.fill(0);
            }

            // FG Voltage Generation
            getFgVoltage() {
                if(this.fgNodePlus === null && this.fgNodeMinus === null) return 0;
                const type = document.querySelector('.fg-wave.bg-blue-600').dataset.wave;
                const freq = parseFloat(document.getElementById('fg-freq').value);
                const amp = parseFloat(document.getElementById('fg-level').value); // Level
                
                const w = 2 * Math.PI * freq;
                const phase = w * this.time;
                
                if(type === 'sine') return Math.sin(phase) * amp;
                if(type === 'square') return Math.sign(Math.sin(phase)) * amp;
                return 0;
            }

            // Step physics forward by dt
            step() {
                const N = this.maxNodes;
                
                // Initialize Matrix (G) and Vector (I)
                let G = Array(N).fill().map(() => Array(N).fill(0));
                let I = Array(N).fill(0);

                // Minimum conductance to prevent singular matrix (floating nodes)
                const G_min = 1e-9;
                for(let i=1; i<N; i++) G[i][i] += G_min;

                const fgV = this.getFgVoltage();

                // Build Matrices
                this.components.forEach(c => {
                    const i = c.n1; // Node 1
                    const j = c.n2; // Node 2
                    
                    let g = 0;
                    let i_eq = 0;

                    if (c.type === 'wire') {
                        g = 1.0 / 0.01; // 0.01 ohm wire
                    } 
                    else if (c.type === 'resistor') {
                        g = 1.0 / Math.max(c.val, 1e-3);
                    } 
                    else if (c.type === 'capacitor') {
                        // Backward Euler: Capacitor acts as resistor in parallel with current source
                        const C = c.val * 1e-6; // Convert uF to F
                        g = C / this.dt;
                        const vOld1 = this.voltages[i] || 0;
                        const vOld2 = j > 0 ? (this.voltages[j] || 0) : 0;
                        i_eq = g * (vOld1 - vOld2);
                    }
                    else if (c.type === 'diode') {
                        // Piecewise Linear Diode Model based on previous step voltage
                        const vOld1 = this.voltages[i] || 0;
                        const vOld2 = j > 0 ? (this.voltages[j] || 0) : 0;
                        if ((vOld1 - vOld2) > 0.6) {
                            g = 1.0 / 10; // 10 ohms when ON
                        } else {
                            g = 1.0 / 1e6; // 1M ohms when OFF
                        }
                    }

                    // Stamp into matrix (Node 0 is implicitly ground, we don't stamp it)
                    if (i > 0) G[i][i] += g;
                    if (j > 0) G[j][j] += g;
                    if (i > 0 && j > 0) { G[i][j] -= g; G[j][i] -= g; }

                    if (i_eq !== 0) {
                        if (i > 0) I[i] += i_eq;
                        if (j > 0) I[j] -= i_eq;
                    }
                });

                // Function Generator (Norton Equivalent: current source + parallel resistor)
                if (this.fgNodePlus !== null || this.fgNodeMinus !== null) {
                    const g_fg = 1.0 / 50.0; // 50 ohm internal resistance
                    const p = this.fgNodePlus || 0;
                    const m = this.fgNodeMinus || 0;

                    if (p > 0) G[p][p] += g_fg;
                    if (m > 0) G[m][m] += g_fg;
                    if (p > 0 && m > 0) {
                        G[p][m] -= g_fg;
                        G[m][p] -= g_fg;
                    }

                    if (fgV !== 0) {
                        const i_eq = fgV * g_fg;
                        if (p > 0) I[p] += i_eq;
                        if (m > 0) I[m] -= i_eq;
                    }
                }

                // Hard Grounds (Force node voltage to 0)
                this.gndNodes.forEach(node => {
                    if(node > 0) {
                        for(let k=1; k<N; k++) G[node][k] = 0; // Clear row
                        G[node][node] = 1.0;
                        I[node] = 0;
                    }
                });

                // Solve Matrix G * V = I (Gaussian Elimination)
                // We only solve for active nodes to save massive CPU time
                const activeNodes = new Set([...this.gndNodes]);
                if(this.fgNodePlus) activeNodes.add(this.fgNodePlus);
                if(this.fgNodeMinus) activeNodes.add(this.fgNodeMinus);
                if(this.croCh1Node) activeNodes.add(this.croCh1Node);
                if(this.croCh2Node) activeNodes.add(this.croCh2Node);
                if(this.croMinusNode) activeNodes.add(this.croMinusNode);
                this.components.forEach(c => { activeNodes.add(c.n1); if(c.n2) activeNodes.add(c.n2); });
                activeNodes.delete(0); // Ignore absolute ground
                
                const idxMap = Array.from(activeNodes);
                const K = idxMap.length;
                
                if (K > 0) {
                    let G_sub = Array(K).fill().map(() => Array(K).fill(0));
                    let I_sub = Array(K).fill(0);
                    
                    for(let r=0; r<K; r++) {
                        I_sub[r] = I[idxMap[r]];
                        for(let c=0; c<K; c++) {
                            G_sub[r][c] = G[idxMap[r]][idxMap[c]];
                        }
                    }

                    const V_sub = this.solveGaussian(G_sub, I_sub);
                    
                    // Update global voltages
                    for(let r=0; r<K; r++) {
                        this.voltages[idxMap[r]] = V_sub[r];
                    }
                }
                
                this.time += this.dt;
            }

            solveGaussian(A, B) {
                const n = B.length;
                let x = new Array(n).fill(0);
                for (let i = 0; i < n; i++) {
                    let maxEl = Math.abs(A[i][i]); let maxRow = i;
                    for (let k = i + 1; k < n; k++) {
                        if (Math.abs(A[k][i]) > maxEl) { maxEl = Math.abs(A[k][i]); maxRow = k; }
                    }
                    if (maxEl < 1e-12) continue;
                    for (let k = i; k < n; k++) { let tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp; }
                    let tmpB = B[maxRow]; B[maxRow] = B[i]; B[i] = tmpB;
                    for (let k = i + 1; k < n; k++) {
                        let c = -A[k][i] / A[i][i];
                        for (let j = i; j < n; j++) {
                            if (i === j) A[k][j] = 0; else A[k][j] += c * A[i][j];
                        }
                        B[k] += c * B[i];
                    }
                }
                for (let i = n - 1; i >= 0; i--) {
                    if (Math.abs(A[i][i]) < 1e-12) { x[i] = 0; } else {
                        x[i] = B[i] / A[i][i];
                        for (let k = i - 1; k >= 0; k--) B[k] -= A[k][i] * x[i];
                    }
                }
                return x;
            }
        }

        const engine = new AnalogEngine();

        // --- STREAMING_CHUNK: Interactions & Tool Logic ---
        
        let currentTool = 'wire';
        let firstHole = null;
        let compCounter = 0;

        // Tool Selection
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                if(firstHole) {
                    firstHole.el.classList.remove('selected');
                    firstHole = null; // reset midway click
                }
            });
        });

        // FG Wave Selection
        document.querySelectorAll('.fg-wave').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.fg-wave').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-blue-600', 'text-white');
                btn.classList.remove('text-slate-400');
            });
        });

        function handleHoleClick(e, el, nodeId) {
            // Probes are single click
            if (['fg_plus', 'fg_minus', 'cro_ch1', 'cro_ch2', 'cro_minus', 'gnd'].includes(currentTool)) {
                if(currentTool === 'fg_plus') engine.fgNodePlus = nodeId;
                if(currentTool === 'fg_minus') engine.fgNodeMinus = nodeId;
                if(currentTool === 'cro_ch1') engine.croCh1Node = nodeId;
                if(currentTool === 'cro_ch2') engine.croCh2Node = nodeId;
                if(currentTool === 'cro_minus') engine.croMinusNode = nodeId;
                if(currentTool === 'gnd') engine.gndNodes.add(nodeId);
                
                const c = { id: compCounter++, type: currentTool, n1: nodeId, el1: el };
                // Remove existing of same probe type to prevent duplicates
                engine.components = engine.components.filter(cmp => cmp.type !== currentTool || currentTool==='gnd'); 
                engine.components.push(c);
                drawComponents();
                return;
            }

            // Two-terminal components
            if (!firstHole) {
                firstHole = { el, nodeId };
                el.classList.add('selected');
            } else {
                if (firstHole.nodeId === nodeId) {
                    alert("Cannot connect a component to the same node.");
                    firstHole.el.classList.remove('selected');
                    firstHole = null;
                    return;
                }
                
                let val = 0;
                if(currentTool === 'resistor') val = parseFloat(document.getElementById('val-resistor').value);
                if(currentTool === 'capacitor') val = parseFloat(document.getElementById('val-capacitor').value);
                
                const comp = { 
                    id: compCounter++, 
                    type: currentTool, 
                    n1: firstHole.nodeId, 
                    n2: nodeId, 
                    val: val,
                    el1: firstHole.el, 
                    el2: el 
                };
                
                engine.components.push(comp);
                
                firstHole.el.classList.remove('selected');
                firstHole = null;
                
                // Reboot simulation on topology change
                engine.reset();
                drawComponents();
            }
        }

        // SVG Drawing
        const svg = document.getElementById('svg-overlay');
        function drawComponents() {
            updateNodePositions(); // Ensure coords are fresh
            svg.innerHTML = '';
            
            engine.components.forEach(c => {
                const p1 = nodePositions.get(c.el1);
                
                // Draw Single Terminal Probes
                if (['fg_plus', 'fg_minus', 'cro_ch1', 'cro_ch2', 'cro_minus', 'gnd'].includes(c.type)) {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', p1.x);
                    circle.setAttribute('cy', p1.y);
                    circle.setAttribute('r', 8);
                    
                    if(c.type === 'fg_plus') circle.setAttribute('fill', '#ef4444'); // Red
                    if(c.type === 'fg_minus') circle.setAttribute('fill', '#475569'); // Slate
                    if(c.type === 'cro_ch1') circle.setAttribute('fill', '#10b981'); // Emerald
                    if(c.type === 'cro_ch2') circle.setAttribute('fill', '#eab308'); // Yellow
                    if(c.type === 'cro_minus') circle.setAttribute('fill', '#475569'); // Slate
                    if(c.type === 'gnd') circle.setAttribute('fill', '#000000'); // Black
                    
                    circle.classList.add('component-line');
                    circle.onclick = () => deleteComponent(c.id);
                    svg.appendChild(circle);
                    
                    // Label
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', p1.x + 12);
                    text.setAttribute('y', p1.y + 4);
                    text.setAttribute('fill', '#fff');
                    text.setAttribute('font-size', '10px');
                    text.setAttribute('font-weight', 'bold');
                    
                    let label = c.type.toUpperCase();
                    if(c.type === 'fg_plus') label = 'FG+';
                    if(c.type === 'fg_minus') label = 'FG-';
                    if(c.type === 'cro_ch1') label = 'CH1';
                    if(c.type === 'cro_ch2') label = 'CH2';
                    if(c.type === 'cro_minus') label = 'CRO-';
                    
                    text.textContent = label;
                    svg.appendChild(text);
                    return;
                }

                // Draw Two Terminal Components
                const p2 = nodePositions.get(c.el2);
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x);
                line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x);
                line.setAttribute('y2', p2.y);
                
                if (c.type === 'wire') line.setAttribute('stroke', '#3b82f6'); // Blue
                else if (c.type === 'resistor') line.setAttribute('stroke', '#d97706'); // Amber/Tan
                else if (c.type === 'capacitor') line.setAttribute('stroke', '#0ea5e9'); // Light blue
                else if (c.type === 'diode') line.setAttribute('stroke', '#94a3b8'); // Gray
                
                line.classList.add('component-line');
                line.onclick = () => deleteComponent(c.id);
                svg.appendChild(line);

                // Component Graphic Overlay (Midpoint)
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                
                if (c.type === 'resistor') {
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    r.setAttribute('x', midX - 10); r.setAttribute('y', midY - 5);
                    r.setAttribute('width', 20); r.setAttribute('height', 10);
                    r.setAttribute('fill', '#f59e0b');
                    r.setAttribute('pointer-events', 'none');
                    svg.appendChild(r);
                }
                else if (c.type === 'capacitor') {
                    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    r.setAttribute('x', midX - 4); r.setAttribute('y', midY - 8);
                    r.setAttribute('width', 8); r.setAttribute('height', 16);
                    r.setAttribute('fill', '#0284c7');
                    r.setAttribute('pointer-events', 'none');
                    svg.appendChild(r);
                }
                else if (c.type === 'diode') {
                    const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    // Triangle pointing to n2 (cathode)
                    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    const size = 8;
                    const pA = `${midX + Math.cos(ang)*size},${midY + Math.sin(ang)*size}`;
                    const pB = `${midX + Math.cos(ang + 2.35)*size},${midY + Math.sin(ang + 2.35)*size}`;
                    const pC = `${midX + Math.cos(ang - 2.35)*size},${midY + Math.sin(ang - 2.35)*size}`;
                    p.setAttribute('points', `${pA} ${pB} ${pC}`);
                    p.setAttribute('fill', '#1e293b');
                    p.setAttribute('pointer-events', 'none');
                    svg.appendChild(p);
                }
            });
        }

        function deleteComponent(id) {
            const comp = engine.components.find(c => c.id === id);
            if (comp) {
                if(comp.type === 'fg_plus') engine.fgNodePlus = null;
                if(comp.type === 'fg_minus') engine.fgNodeMinus = null;
                if(comp.type === 'cro_ch1') engine.croCh1Node = null;
                if(comp.type === 'cro_ch2') engine.croCh2Node = null;
                if(comp.type === 'cro_minus') engine.croMinusNode = null;
                if(comp.type === 'gnd') engine.gndNodes.delete(comp.n1);
                
                engine.components = engine.components.filter(c => c.id !== id);
                engine.reset();
                drawComponents();
            }
        }

        function clearBoard() {
            engine.components = [];
            engine.fgNodePlus = null;
            engine.fgNodeMinus = null;
            engine.croCh1Node = null;
            engine.croCh2Node = null;
            engine.croMinusNode = null;
            engine.gndNodes.clear();
            engine.reset();
            drawComponents();
        }

        // --- STREAMING_CHUNK: Real-Time Rendering & Simulation Loop ---

        const canvas = document.getElementById('cro-canvas');
        const ctx = canvas.getContext('2d');
        let animationId;
        
        // UI Listeners
        const timeInput = document.getElementById('cro-time');
        const xPosInput = document.getElementById('cro-xpos');
        const volt1Input = document.getElementById('cro-volt1');
        const volt2Input = document.getElementById('cro-volt2');
        const freqInput = document.getElementById('fg-freq');
        const levelInput = document.getElementById('fg-level');
        
        timeInput.oninput = () => document.getElementById('lbl-time').innerText = timeInput.value + ' ms';
        xPosInput.oninput = () => document.getElementById('lbl-xpos').innerText = parseFloat(xPosInput.value).toFixed(1) + ' div';
        volt1Input.oninput = () => document.getElementById('lbl-volt1').innerText = volt1Input.value + ' V';
        volt2Input.oninput = () => document.getElementById('lbl-volt2').innerText = volt2Input.value + ' V';
        freqInput.oninput = () => document.getElementById('lbl-freq').innerText = freqInput.value + ' Hz';
        levelInput.oninput = () => document.getElementById('lbl-level').innerText = levelInput.value + ' V';

        function renderOscilloscope() {
            // Clear Screen
            ctx.fillStyle = '#022c22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Grid
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<=canvas.width; x+=canvas.width/10) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
            for(let y=0; y<=canvas.height; y+=canvas.height/8) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
            ctx.stroke();
            
            // Center Lines
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
            ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2);
            ctx.stroke();

            // Run Simulation & Draw Trace
            const timePerDiv = parseFloat(timeInput.value) * 1e-3; // ms to sec
            const voltsPerDiv1 = parseFloat(volt1Input.value);
            const voltsPerDiv2 = parseFloat(volt2Input.value);
            const totalTime = timePerDiv * 10; // 10 divisions wide
            
            // Sync Phase & X-Position
            const fgFreq = parseFloat(freqInput.value);
            const period = 1.0 / fgFreq;
            
            const xShiftDivs = parseFloat(xPosInput.value);
            const timeShift = xShiftDivs * timePerDiv;

            engine.reset();
            
            // Offset the initial engine time so drawing starts at the shifted position
            // We run a preroll to charge capacitors based on this shifted start time.
            const prerollSteps = Math.min(1000, Math.floor((period * 3) / engine.dt));
            engine.time = -timeShift - (prerollSteps * engine.dt);
            
            for(let i=0; i<prerollSteps; i++) engine.step();

            const pixels = canvas.width;
            const timeStep = totalTime / pixels;
            
            let pts1 = [];
            let pts2 = [];
            let currentDisplayVolts1 = 0;
            let currentDisplayVolts2 = 0;
            
            for(let x=0; x<pixels; x++) {
                // Step physics forward
                let localTimeAccumulator = 0;
                while(localTimeAccumulator < timeStep) {
                    engine.step();
                    localTimeAccumulator += engine.dt;
                }
                
                // Calculate Voltages relative to CRO (-)
                const vMinus = engine.croMinusNode ? engine.voltages[engine.croMinusNode] : 0;
                const v1 = engine.croCh1Node ? engine.voltages[engine.croCh1Node] - vMinus : 0;
                const v2 = engine.croCh2Node ? engine.voltages[engine.croCh2Node] - vMinus : 0;
                
                if(x === pixels - 1) { 
                    currentDisplayVolts1 = v1; 
                    currentDisplayVolts2 = v2; 
                }
                
                // Map V to Y pixel
                const y1 = (canvas.height/2) - ((v1 / voltsPerDiv1) * (canvas.height/8));
                const y2 = (canvas.height/2) - ((v2 / voltsPerDiv2) * (canvas.height/8));
                
                pts1.push({x, y: y1});
                pts2.push({x, y: y2});
            }
            
            // Draw CH1 (Green)
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<pts1.length; i++) {
                if(i===0) ctx.moveTo(pts1[i].x, pts1[i].y);
                else ctx.lineTo(pts1[i].x, pts1[i].y);
            }
            ctx.stroke();

            // Draw CH2 (Yellow)
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<pts2.length; i++) {
                if(i===0) ctx.moveTo(pts2[i].x, pts2[i].y);
                else ctx.lineTo(pts2[i].x, pts2[i].y);
            }
            ctx.stroke();
            
            // Update Reading
            document.getElementById('cro-reading').innerHTML = `<span class="text-emerald-400">CH1: ${currentDisplayVolts1.toFixed(2)}V</span> | <span class="text-yellow-400">CH2: ${currentDisplayVolts2.toFixed(2)}V</span>`;
            
            animationId = requestAnimationFrame(renderOscilloscope);
        }

        // --- Demo Loaders ---
        function loadDemo(type) {
            clearBoard();
            
            // Find specific DOM holes to attach to
            const getHole = (node) => Array.from(holesMap.entries()).find(([el, n]) => n === node)[0];
            
            // Let's use Column 5 (Node 9), Column 10 (Node 14) and Bottom Ground (Node 3)
            // Node mapping is dynamic, so we just pick arbitrary nodes safely
            const n_in = 10;
            const n_mid = 15;
            const n_gnd = 3; // Bottom Red Rail

            const h_in = getHole(n_in);
            const h_mid = getHole(n_mid);
            const h_gnd = getHole(n_gnd);

            if (type === 'rc') {
                freqInput.value = 500; freqInput.oninput();
                levelInput.value = 5; levelInput.oninput();
                timeInput.value = 0.5; timeInput.oninput();
                document.querySelector('[data-wave="square"]').click();
                
                // Add Components directly to engine
                engine.fgNodePlus = n_in;
                engine.croCh1Node = n_in; // CH1 sees input
                engine.croCh2Node = n_mid; // CH2 sees output
                engine.fgNodeMinus = n_gnd;
                engine.croMinusNode = n_gnd;
                engine.gndNodes.add(n_gnd);
                
                engine.components.push({ id: compCounter++, type: 'fg_plus', n1: n_in, el1: h_in });
                engine.components.push({ id: compCounter++, type: 'cro_ch1', n1: n_in, el1: h_in });
                engine.components.push({ id: compCounter++, type: 'cro_ch2', n1: n_mid, el1: h_mid });
                engine.components.push({ id: compCounter++, type: 'fg_minus', n1: n_gnd, el1: h_gnd });
                engine.components.push({ id: compCounter++, type: 'cro_minus', n1: n_gnd, el1: h_gnd });
                engine.components.push({ id: compCounter++, type: 'gnd', n1: n_gnd, el1: h_gnd });
                
                engine.components.push({ id: compCounter++, type: 'resistor', n1: n_in, n2: n_mid, val: 1000, el1: h_in, el2: h_mid });
                engine.components.push({ id: compCounter++, type: 'capacitor', n1: n_mid, n2: n_gnd, val: 0.22, el1: h_mid, el2: h_gnd });
            } 
            else if (type === 'clipper') {
                freqInput.value = 100; freqInput.oninput();
                levelInput.value = 8; levelInput.oninput();
                timeInput.value = 2.0; timeInput.oninput();
                document.querySelector('[data-wave="sine"]').click();
                
                engine.fgNodePlus = n_in;
                engine.croCh1Node = n_in;
                engine.croCh2Node = n_mid;
                engine.fgNodeMinus = n_gnd;
                engine.croMinusNode = n_gnd;
                engine.gndNodes.add(n_gnd);
                
                engine.components.push({ id: compCounter++, type: 'fg_plus', n1: n_in, el1: h_in });
                engine.components.push({ id: compCounter++, type: 'cro_ch1', n1: n_in, el1: h_in });
                engine.components.push({ id: compCounter++, type: 'cro_ch2', n1: n_mid, el1: h_mid });
                engine.components.push({ id: compCounter++, type: 'fg_minus', n1: n_gnd, el1: h_gnd });
                engine.components.push({ id: compCounter++, type: 'cro_minus', n1: n_gnd, el1: h_gnd });
                engine.components.push({ id: compCounter++, type: 'gnd', n1: n_gnd, el1: h_gnd });
                
                engine.components.push({ id: compCounter++, type: 'resistor', n1: n_in, n2: n_mid, val: 1000, el1: h_in, el2: h_mid });
                engine.components.push({ id: compCounter++, type: 'diode', n1: n_mid, n2: n_gnd, val: 0, el1: h_mid, el2: h_gnd });
            }
            
            drawComponents();
        }

        // Init App
        initBreadboard();
        loadDemo('rc');
        renderOscilloscope();

    </script>
</body>
