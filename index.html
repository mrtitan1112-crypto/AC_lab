<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Analog Circuit Lab - Simulator & Breadboard</title>
    <!-- Tailwind CSS for UI overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls to allow the user to rotate the 3D view -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Tailwind slate-900 */
            font-family: 'Inter', sans-serif;
            color: white;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive-panel {
            pointer-events: auto;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom scrollbar for component list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
        
        select, input[type=number] {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 0.375rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            outline: none;
        }
        select:focus, input[type=number]:focus {
            border-color: #3b82f6;
        }

        #cro-screen-canvas { display: none; }
    </style>
</head>
<body>

    <!-- Hidden canvas used to draw the waveform -->
    <canvas id="cro-screen-canvas" width="512" height="512"></canvas>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="p-4">
        
        <!-- Header -->
        <div class="interactive-panel rounded-xl p-3 shadow-lg flex justify-between items-center w-full mx-auto mb-2">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">3D Analog Circuit Lab</h1>
                <p class="text-slate-400 text-xs">SPICE-lite Nodal Simulation Engine</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="loadDemoCircuit('rc')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs rounded transition-colors">Demo: RC Filter</button>
                <button onclick="loadDemoCircuit('clipper')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs rounded transition-colors">Demo: Diode Clipper</button>
                <button onclick="clearCircuit()" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-500 text-white text-xs rounded transition-colors">Clear Board</button>
            </div>
        </div>

        <div class="flex flex-1 overflow-hidden space-x-4">
            
            <!-- Left Panel: FG & CRO Controls -->
            <div class="flex flex-col space-y-4 w-72 overflow-y-auto pr-2 pb-2">
                
                <!-- Function Generator -->
                <div class="interactive-panel rounded-xl p-4 shadow-xl shrink-0">
                    <h2 class="text-sm font-semibold text-blue-400 mb-3 border-b border-slate-600 pb-1">Function Generator</h2>
                    
                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] text-slate-400 uppercase tracking-wider block mb-1">Waveform</label>
                            <div class="flex bg-slate-900 rounded p-1">
                                <button onclick="setWaveType('sine')" id="btn-sine" class="flex-1 py-1 text-xs rounded bg-blue-600 text-white">Sine</button>
                                <button onclick="setWaveType('square')" id="btn-square" class="flex-1 py-1 text-xs rounded text-slate-400 hover:bg-slate-800">Square</button>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <label class="text-slate-400">Freq (Hz)</label>
                                <span id="freq-val" class="text-blue-300">1000</span>
                            </div>
                            <input type="range" id="freq-slider" min="10" max="5000" value="1000" step="10">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <label class="text-slate-400">Amplitude (Vpp)</label>
                                <span id="amp-val" class="text-blue-300">5.0</span>
                            </div>
                            <input type="range" id="amp-slider" min="1" max="10" value="5" step="0.5">
                        </div>
                    </div>
                </div>

                <!-- Oscilloscope -->
                <div class="interactive-panel rounded-xl p-4 shadow-xl shrink-0">
                    <h2 class="text-sm font-semibold text-emerald-400 mb-3 border-b border-slate-600 pb-1">Oscilloscope (CH1)</h2>
                    
                    <div class="space-y-3">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <label class="text-slate-400">Time/Div</label>
                                <span id="time-div-val" class="text-emerald-300">0.5 ms</span>
                            </div>
                            <input type="range" id="time-div-slider" min="0.1" max="5" value="0.5" step="0.1">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <label class="text-slate-400">Volts/Div</label>
                                <span id="volt-div-val" class="text-emerald-300">2.0 V</span>
                            </div>
                            <input type="range" id="volt-div-slider" min="0.5" max="5" value="2.0" step="0.5">
                        </div>
                    </div>
                </div>

                <!-- Instructions -->
                <div class="interactive-panel rounded-xl p-3 shadow-xl shrink-0 text-xs text-slate-400 leading-relaxed">
                    <strong>Controls:</strong> Left-click to rotate, Right-click to pan, Scroll to zoom.<br><br>
                    <strong>Breadboard:</strong> Nodes 1-10 are the top rows. Nodes 11-20 are bottom rows.
                </div>
            </div>

            <!-- Spacer -->
            <div class="flex-1 pointer-events-none"></div>

            <!-- Right Panel: Circuit Builder -->
            <div class="interactive-panel rounded-xl flex flex-col w-80 shadow-xl overflow-hidden">
                <div class="p-4 border-b border-slate-600 bg-slate-800/50">
                    <h2 class="text-sm font-semibold text-orange-400 flex items-center">
                        Circuit Builder
                    </h2>
                </div>
                
                <div class="p-4 bg-slate-800/30 border-b border-slate-700">
                    <div class="space-y-3 text-sm">
                        <div class="flex flex-col">
                            <label class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Type</label>
                            <select id="comp-type" onchange="updateCompForm()">
                                <option value="resistor">Resistor (R)</option>
                                <option value="capacitor">Capacitor (C)</option>
                                <option value="diode">Diode (D)</option>
                                <option value="wire">Jumper Wire</option>
                                <option value="fg">Connect Function Gen</option>
                                <option value="cro">Connect CRO Probe</option>
                                <option value="gnd">Connect Ground</option>
                            </select>
                        </div>
                        
                        <div class="flex space-x-2">
                            <div class="flex-1 flex flex-col">
                                <label class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Node A (Row)</label>
                                <input type="number" id="comp-nodeA" min="1" max="20" value="1">
                            </div>
                            <div class="flex-1 flex flex-col" id="nodeB-container">
                                <label class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Node B (Row)</label>
                                <input type="number" id="comp-nodeB" min="1" max="20" value="2">
                            </div>
                        </div>

                        <div class="flex flex-col" id="value-container">
                            <label class="text-[10px] text-slate-400 uppercase tracking-wider mb-1" id="val-label">Value (Ohms)</label>
                            <input type="number" id="comp-value" value="1000" step="any">
                        </div>

                        <button onclick="addComponentFromUI()" class="w-full py-2 bg-orange-600 hover:bg-orange-500 text-white text-sm font-semibold rounded transition-colors shadow">
                            Place Component
                        </button>
                    </div>
                </div>

                <!-- Component List -->
                <div class="flex-1 overflow-y-auto p-4 space-y-2" id="component-list">
                    <!-- Dynamic List -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Global Simulation State ---
        const simState = {
            waveType: 'sine',
            frequency: 1000,
            amplitude: 5,
            
            timePerDiv: 0.5,
            voltsPerDiv: 2.0,
            
            fgNode: null,
            croNode: null,
            groundNodes: [],
            components: [] // { id, type, n1, n2, value, mesh }
        };

        // --- 2. Custom MNA (Modified Nodal Analysis) Simulation Engine ---
        // Solves circuit physics using Backward Euler integration and Gaussian Elimination
        class CircuitSimulator {
            constructor() {
                this.numNodes = 20; // Breadboard rows 1 to 20 (Node 0 is absolute ground)
                this.dt = 1e-6;     // 1 microsecond timestep for stability
                this.reset();
            }

            reset() {
                // Initialize voltages for nodes 1-20 (index 0 is unused ground)
                this.voltages = new Array(this.numNodes + 1).fill(0);
                this.time = 0;
            }

            // Runs the simulation forward to a target time and returns the CRO node voltage
            runToTime(targetTimeSec, fgVoltageFunc) {
                const maxSteps = 10000; // safety limit
                let steps = 0;
                
                while (this.time < targetTimeSec && steps < maxSteps) {
                    this.step(fgVoltageFunc(this.time));
                    this.time += this.dt;
                    steps++;
                }
                
                return simState.croNode ? this.voltages[simState.croNode] : 0;
            }

            step(fgVolts) {
                const N = this.numNodes;
                // Create Admittance matrix (Y) and Current vector (J)
                // 2D Array initialized to 0
                let Y = Array(N).fill().map(() => Array(N).fill(0));
                let J = Array(N).fill(0);

                // Add small conductance to ground for all nodes to prevent singular matrix (floating nodes)
                const G_min = 1e-9;
                for(let i=0; i<N; i++) Y[i][i] += G_min;

                // Build Matrix from Components
                simState.components.forEach(c => {
                    // Convert 1-based node index to 0-based for matrix array (Node 1 -> index 0)
                    const i = c.n1 - 1;
                    const j = c.n2 ? c.n2 - 1 : -1; 
                    
                    let g = 0;
                    let i_eq = 0;

                    if (c.type === 'resistor' || c.type === 'wire') {
                        const rVal = c.type === 'wire' ? 0.01 : c.value;
                        g = 1.0 / Math.max(rVal, 1e-3);
                    } 
                    else if (c.type === 'capacitor') {
                        // Backward Euler: G = C / dt, I_eq = G * (V_i_old - V_j_old)
                        g = c.value / this.dt;
                        const vOld1 = this.voltages[c.n1];
                        const vOld2 = j >= 0 ? this.voltages[c.n2] : 0;
                        i_eq = g * (vOld1 - vOld2);
                    }
                    else if (c.type === 'diode') {
                        // Ideal diode heuristic: High conductance if forward biased in previous step
                        const vOld1 = this.voltages[c.n1];
                        const vOld2 = j >= 0 ? this.voltages[c.n2] : 0;
                        if ((vOld1 - vOld2) > 0.4) {
                            g = 1.0 / 10; // 10 ohms when ON
                        } else {
                            g = 1.0 / 1e6; // 1M ohms when OFF
                        }
                    }

                    // Apply to Matrix
                    if (i >= 0 && i < N) Y[i][i] += g;
                    if (j >= 0 && j < N) Y[j][j] += g;
                    
                    if (i >= 0 && j >= 0 && i < N && j < N) {
                        Y[i][j] -= g;
                        Y[j][i] -= g;
                    }

                    if (i_eq !== 0) {
                        if (i >= 0 && i < N) J[i] += i_eq;
                        if (j >= 0 && j < N) J[j] -= i_eq;
                    }
                });

                // Apply Function Generator (Modeled as voltage source with 50 ohm series resistance)
                if (simState.fgNode) {
                    const idx = simState.fgNode - 1;
                    if (idx >= 0 && idx < N) {
                        const g_fg = 1.0 / 50.0;
                        Y[idx][idx] += g_fg;
                        J[idx] += fgVolts * g_fg;
                    }
                }

                // Apply Hard Grounds
                simState.groundNodes.forEach(node => {
                    const idx = node - 1;
                    if (idx >= 0 && idx < N) {
                        // Overwrite row to force V = 0
                        for(let k=0; k<N; k++) Y[idx][k] = 0;
                        Y[idx][idx] = 1.0;
                        J[idx] = 0;
                        // To keep matrix symmetric-ish, zero out column (optional but good)
                        for(let k=0; k<N; k++) {
                            if (k !== idx) Y[k][idx] = 0; 
                        }
                    }
                });

                // Solve Matrix Y * V = J using Gaussian Elimination
                const newV = this.solveGaussian(Y, J);
                
                // Update voltages
                for(let i=0; i<N; i++) {
                    this.voltages[i+1] = newV[i];
                }
            }

            // Standard Gaussian Elimination
            solveGaussian(A, B) {
                const n = B.length;
                let x = new Array(n).fill(0);
                
                for (let i = 0; i < n; i++) {
                    let maxEl = Math.abs(A[i][i]);
                    let maxRow = i;
                    for (let k = i + 1; k < n; k++) {
                        if (Math.abs(A[k][i]) > maxEl) {
                            maxEl = Math.abs(A[k][i]);
                            maxRow = k;
                        }
                    }
                    
                    if (maxEl < 1e-12) continue; // Skip singular rows

                    for (let k = i; k < n; k++) {
                        let tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp;
                    }
                    let tmpB = B[maxRow]; B[maxRow] = B[i]; B[i] = tmpB;

                    for (let k = i + 1; k < n; k++) {
                        let c = -A[k][i] / A[i][i];
                        for (let j = i; j < n; j++) {
                            if (i === j) A[k][j] = 0;
                            else A[k][j] += c * A[i][j];
                        }
                        B[k] += c * B[i];
                    }
                }

                for (let i = n - 1; i >= 0; i--) {
                    if (Math.abs(A[i][i]) < 1e-12) {
                        x[i] = 0;
                    } else {
                        x[i] = B[i] / A[i][i];
                        for (let k = i - 1; k >= 0; k--) {
                            B[k] -= A[k][i] * x[i];
                        }
                    }
                }
                return x;
            }
        }

        const simulator = new CircuitSimulator();

        // Function generator math
        function getFgVoltage(t_sec) {
            const freq = simState.frequency;
            const ampBase = simState.amplitude / 2;
            const w = 2 * Math.PI * freq;
            
            if (simState.waveType === 'sine') return Math.sin(w * t_sec) * ampBase;
            if (simState.waveType === 'square') return Math.sign(Math.sin(w * t_sec)) * ampBase;
            return 0;
        }

        // --- STREAMING_CHUNK:UI Logic and Canvas Rendering... ---
        
        // UI event listeners
        document.getElementById('freq-slider').addEventListener('input', (e) => {
            simState.frequency = parseFloat(e.target.value);
            document.getElementById('freq-val').innerText = simState.frequency + ' Hz';
        });
        document.getElementById('amp-slider').addEventListener('input', (e) => {
            simState.amplitude = parseFloat(e.target.value);
            document.getElementById('amp-val').innerText = simState.amplitude.toFixed(1) + ' Vpp';
        });
        document.getElementById('time-div-slider').addEventListener('input', (e) => {
            simState.timePerDiv = parseFloat(e.target.value);
            document.getElementById('time-div-val').innerText = simState.timePerDiv.toFixed(1) + ' ms';
        });
        document.getElementById('volt-div-slider').addEventListener('input', (e) => {
            simState.voltsPerDiv = parseFloat(e.target.value);
            document.getElementById('volt-div-val').innerText = simState.voltsPerDiv.toFixed(1) + ' V';
        });

        function setWaveType(type) {
            simState.waveType = type;
            document.getElementById('btn-sine').className = type === 'sine' ? 'flex-1 py-1 text-xs rounded bg-blue-600 text-white' : 'flex-1 py-1 text-xs rounded text-slate-400 hover:bg-slate-800';
            document.getElementById('btn-square').className = type === 'square' ? 'flex-1 py-1 text-xs rounded bg-blue-600 text-white' : 'flex-1 py-1 text-xs rounded text-slate-400 hover:bg-slate-800';
        }

        function updateCompForm() {
            const type = document.getElementById('comp-type').value;
            const bCont = document.getElementById('nodeB-container');
            const vCont = document.getElementById('value-container');
            const vLabel = document.getElementById('val-label');
            const vInput = document.getElementById('comp-value');

            bCont.style.display = ['fg', 'cro', 'gnd'].includes(type) ? 'none' : 'flex';
            
            if (type === 'resistor') { vCont.style.display = 'flex'; vLabel.innerText = 'Resistance (Ohms)'; vInput.value = 1000; }
            else if (type === 'capacitor') { vCont.style.display = 'flex'; vLabel.innerText = 'Capacitance (Farads)'; vInput.value = 0.000001; } // 1uF
            else { vCont.style.display = 'none'; }
        }
        updateCompForm();

        // 2D Canvas CRO Drawing
        const croCanvas = document.getElementById('cro-screen-canvas');
        const croCtx = croCanvas.getContext('2d');
        const canvasSize = 512;
        const gridDivisions = 10;
        const pixelsPerDiv = canvasSize / gridDivisions;
        let globalRenderTime = 0;

        function updateCROScreen(deltaTime) {
            globalRenderTime += deltaTime;
            
            croCtx.fillStyle = '#022c22'; // Dark emerald background
            croCtx.fillRect(0, 0, canvasSize, canvasSize);

            // Draw Grid
            croCtx.strokeStyle = 'rgba(16, 185, 129, 0.3)'; 
            croCtx.lineWidth = 1;
            croCtx.beginPath();
            for (let i = 0; i <= gridDivisions; i++) {
                let pos = i * pixelsPerDiv;
                croCtx.moveTo(pos, 0); croCtx.lineTo(pos, canvasSize);
                croCtx.moveTo(0, pos); croCtx.lineTo(canvasSize, pos);
            }
            croCtx.stroke();
            croCtx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
            croCtx.beginPath();
            croCtx.moveTo(canvasSize/2, 0); croCtx.lineTo(canvasSize/2, canvasSize);
            croCtx.moveTo(0, canvasSize/2); croCtx.lineTo(canvasSize, canvasSize);
            croCtx.stroke();

            // Trace Simulation over required time window
            const totalTimeMs = simState.timePerDiv * gridDivisions;
            const totalTimeSec = totalTimeMs / 1000.0;
            
            // To ensure trace is stable, we simulate a snapshot based on global time modulo FG period
            // This acts like an ideal Trigger
            const period = 1.0 / simState.frequency;
            const numPeriods = Math.floor(globalRenderTime / period);
            const startTimeSec = numPeriods * period; // Lock start to phase 0 of FG

            // 1. Reset simulator to clear state
            simulator.reset();

            // 2. Pre-roll simulation to reach steady state (especially for capacitors)
            const prerollTime = Math.max(5.0 * period, 0.01);
            simulator.time = startTimeSec - prerollTime;
            while(simulator.time < startTimeSec) {
                simulator.step(getFgVoltage(simulator.time));
                simulator.time += simulator.dt;
            }

            // 3. Draw actual trace
            croCtx.strokeStyle = '#34d399'; 
            croCtx.lineWidth = 3;
            croCtx.shadowBlur = 8;
            croCtx.shadowColor = '#10b981';
            croCtx.beginPath();

            // Render across canvas width
            const timeStepSec = totalTimeSec / canvasSize;
            
            for (let xPx = 0; xPx < canvasSize; xPx++) {
                // Run simulator up to this pixel's time
                const targetTime = startTimeSec + (xPx * timeStepSec);
                let v = simulator.runToTime(targetTime, getFgVoltage);
                
                // Map Voltage to Y pixel
                const yPixelsFromCenter = (v / simState.voltsPerDiv) * pixelsPerDiv;
                const yPx = (canvasSize / 2) - yPixelsFromCenter;
                
                if (xPx === 0) croCtx.moveTo(xPx, yPx);
                else croCtx.lineTo(xPx, yPx);
            }
            croCtx.stroke();
            croCtx.shadowBlur = 0;
            
            croCtx.fillStyle = '#6ee7b7';
            croCtx.font = 'bold 20px sans-serif';
            croCtx.fillText(`${simState.voltsPerDiv}V/div`, 10, 30);
            croCtx.fillText(`${simState.timePerDiv}ms/div`, 10, 55);
        }

        // --- STREAMING_CHUNK:Three.js Environment & Objects... ---
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1;
        controls.target.set(0, 0, 0);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Lab Table
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(40, 1, 20),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
        );
        table.position.y = -0.5;
        table.receiveShadow = true;
        scene.add(table);

        // Common Materials
        const darkPlastMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7 });
        const lightPlastMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
        
        // Build CRO (Left)
        const croGroup = new THREE.Group();
        croGroup.position.set(-10, 0, -3);
        scene.add(croGroup);
        const croBody = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 10), lightPlastMat);
        croBody.position.y = 3;
        croBody.castShadow = true;
        croGroup.add(croBody);
        const croPanel = new THREE.Mesh(new THREE.PlaneGeometry(7.8, 5.8), darkPlastMat);
        croPanel.position.set(0, 3, 5.01);
        croGroup.add(croPanel);

        // CRO Screen Texture
        const croScreenTexture = new THREE.CanvasTexture(croCanvas);
        croScreenTexture.minFilter = THREE.LinearFilter;
        const croScreen = new THREE.Mesh(
            new THREE.PlaneGeometry(4.5, 4.5),
            new THREE.MeshBasicMaterial({ map: croScreenTexture })
        );
        croScreen.position.set(-1.2, 3, 5.02);
        croGroup.add(croScreen);

        // Build Function Gen (Right)
        const fgGroup = new THREE.Group();
        fgGroup.position.set(10, 0, -3);
        scene.add(fgGroup);
        const fgBody = new THREE.Mesh(new THREE.BoxGeometry(7, 3.5, 8), lightPlastMat);
        fgBody.position.y = 1.75;
        fgBody.castShadow = true;
        fgGroup.add(fgBody);
        const fgPanel = new THREE.Mesh(new THREE.PlaneGeometry(6.8, 3.3), darkPlastMat);
        fgPanel.position.set(0, 1.75, 4.01);
        fgGroup.add(fgPanel);

        // --- STREAMING_CHUNK:Breadboard & Component Geometry... ---

        // Build Breadboard (Center)
        const bbGroup = new THREE.Group();
        bbGroup.position.set(0, 0.2, 4);
        scene.add(bbGroup);

        const bbWidth = 10;
        const bbDepth = 6;
        const bbBody = new THREE.Mesh(
            new THREE.BoxGeometry(bbWidth, 0.4, bbDepth),
            new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 })
        );
        bbBody.castShadow = true;
        bbBody.receiveShadow = true;
        bbGroup.add(bbBody);

        // Visual holes (20 rows, 2 columns of 5)
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x111 });
        const numRows = 20;
        const rowSpacing = bbWidth / (numRows + 1);
        
        // Map Node ID (1-20) to 3D World Position
        function getNodeWorldPos(nodeId) {
            if(nodeId < 1 || nodeId > 20) return new THREE.Vector3(0,0,0);
            const isTop = nodeId <= 10;
            const index = isTop ? (nodeId - 1) : (nodeId - 11);
            
            // X position distributed along the board
            const startX = -bbWidth/2 + rowSpacing * 1.5;
            const localX = startX + (index * rowSpacing * 1.8);
            
            // Z position (Top half vs Bottom half)
            const localZ = isTop ? -1.5 : 1.5;
            
            // Return world coordinate
            const pos = new THREE.Vector3(localX, 0.4, localZ);
            pos.applyMatrix4(bbGroup.matrixWorld);
            return pos;
        }

        // --- Dynamic 3D Component Generation ---
        const componentMeshes = new THREE.Group();
        scene.add(componentMeshes);

        function createCylinderBetween(p1, p2, radius, mat) {
            const distance = p1.distanceTo(p2);
            const geom = new THREE.CylinderGeometry(radius, radius, distance, 8);
            geom.translate(0, distance / 2, 0);
            geom.rotateX(Math.PI / 2);
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.copy(p1);
            mesh.lookAt(p2);
            return mesh;
        }

        function buildComponentMesh(comp) {
            const group = new THREE.Group();
            
            const p1 = getNodeWorldPos(comp.n1);
            let p2 = comp.n2 ? getNodeWorldPos(comp.n2) : null;
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            
            // Offset Y so components sit above board
            p1.y += 0.1; 
            if(p2) p2.y += 0.1;

            if (comp.type === 'fg' || comp.type === 'cro' || comp.type === 'gnd') {
                // Draw a wire originating from equipment to the board
                let origin;
                let color;
                if(comp.type === 'fg') { origin = new THREE.Vector3(10, 1.75, 1); color = 0xef4444; } // Red wire from FG
                else if(comp.type === 'cro') { origin = new THREE.Vector3(-10, 3, 2); color = 0xeab308; } // Yellow wire from CRO
                else { origin = new THREE.Vector3(0, -0.5, 8); color = 0x22c55e; } // Green wire from GND (table)

                const curve = new THREE.QuadraticBezierCurve3(
                    origin, 
                    new THREE.Vector3((origin.x + p1.x)/2, 5, (origin.z + p1.z)/2), // High arch
                    p1
                );
                const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.05, 8, false), new THREE.MeshStandardMaterial({color: color}));
                group.add(tube);
            } 
            else if (p2) {
                // Normal two-terminal component
                const mid = p1.clone().lerp(p2, 0.5);
                const archH = 0.5; // Arc height
                
                const pt1 = p1.clone(); pt1.y += archH;
                const pt2 = p2.clone(); pt2.y += archH;
                
                // Leads
                group.add(createCylinderBetween(p1, pt1, 0.03, metalMat));
                group.add(createCylinderBetween(p2, pt2, 0.03, metalMat));

                // Body
                if (comp.type === 'resistor') {
                    const body = createCylinderBetween(pt1, pt2, 0.15, new THREE.MeshStandardMaterial({color: 0xd2b48c})); // Tan
                    group.add(body);
                    // Add stripes (visual only)
                    const stripe = createCylinderBetween(pt1.clone().lerp(pt2, 0.3), pt1.clone().lerp(pt2, 0.35), 0.16, new THREE.MeshBasicMaterial({color: 0xff0000}));
                    group.add(stripe);
                } 
                else if (comp.type === 'capacitor') {
                    // Small disc
                    const body = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16),
                        new THREE.MeshStandardMaterial({color: 0xb45309}) // Ceramic orange
                    );
                    body.position.copy(mid);
                    body.position.y += archH;
                    body.rotation.x = Math.PI/2;
                    group.add(body);
                    
                    // Connect leads to center
                    group.add(createCylinderBetween(pt1, body.position, 0.03, metalMat));
                    group.add(createCylinderBetween(pt2, body.position, 0.03, metalMat));
                }
                else if (comp.type === 'diode') {
                    const body = createCylinderBetween(pt1, pt2, 0.15, new THREE.MeshStandardMaterial({color: 0x111111})); // Black
                    group.add(body);
                    // Cathode stripe near pt2
                    const stripe = createCylinderBetween(pt1.clone().lerp(pt2, 0.8), pt1.clone().lerp(pt2, 0.9), 0.16, new THREE.MeshStandardMaterial({color: 0xaaaaaa}));
                    group.add(stripe);
                }
                else if (comp.type === 'wire') {
                    // Curved jumper wire
                    const curve = new THREE.QuadraticBezierCurve3(p1, new THREE.Vector3(mid.x, mid.y + 1, mid.z), p2);
                    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.04, 8, false), new THREE.MeshStandardMaterial({color: 0x3b82f6})); // Blue
                    group.add(tube);
                }
            }

            componentMeshes.add(group);
            return group;
        }

        // --- STREAMING_CHUNK:Application Logic & Interactions... ---

        let compIdCounter = 0;

        function addComponent(type, n1, n2, value) {
            const comp = { id: compIdCounter++, type, n1, n2, value, mesh: null };
            
            // Handle equipment connections specifically
            if (type === 'fg') { simState.fgNode = n1; }
            else if (type === 'cro') { simState.croNode = n1; }
            else if (type === 'gnd') { simState.groundNodes.push(n1); }
            else { simState.components.push(comp); }
            
            // Build 3D representation
            comp.mesh = buildComponentMesh(comp);
            
            // Add to UI List
            updateUIList();
        }

        function removeComponent(id, type, n1) {
            if (type === 'fg') { simState.fgNode = null; }
            else if (type === 'cro') { simState.croNode = null; }
            else if (type === 'gnd') { simState.groundNodes = simState.groundNodes.filter(n => n !== n1); }
            
            // Remove from state array
            const idx = simState.components.findIndex(c => c.id === id);
            if (idx > -1) {
                const comp = simState.components[idx];
                if (comp.mesh) componentMeshes.remove(comp.mesh);
                simState.components.splice(idx, 1);
            }
            
            // Also need to find and remove mesh for equipment wires which aren't in array
            componentMeshes.children.forEach(child => {
                 if (child.userData.id === id) componentMeshes.remove(child);
            });

            // Rebuild scene completely to ensure clean state
            rebuildAllMeshes();
            updateUIList();
        }

        function rebuildAllMeshes() {
            // Clear existing
            while(componentMeshes.children.length > 0){ 
                componentMeshes.remove(componentMeshes.children[0]); 
            }
            
            // Re-add components
            simState.components.forEach(c => { c.mesh = buildComponentMesh(c); c.mesh.userData.id = c.id; });
            
            // Re-add equipment wires
            if(simState.fgNode) { const m = buildComponentMesh({type:'fg', n1:simState.fgNode}); m.userData.id = 'fg'; }
            if(simState.croNode) { const m = buildComponentMesh({type:'cro', n1:simState.croNode}); m.userData.id = 'cro'; }
            simState.groundNodes.forEach((n, i) => { const m = buildComponentMesh({type:'gnd', n1:n}); m.userData.id = 'gnd'+i; });
        }

        function addComponentFromUI() {
            const type = document.getElementById('comp-type').value;
            const n1 = parseInt(document.getElementById('comp-nodeA').value);
            const n2 = parseInt(document.getElementById('comp-nodeB').value);
            const val = parseFloat(document.getElementById('comp-value').value);
            
            if(n1 === n2 && ['resistor','capacitor','diode','wire'].includes(type)) {
                alert("Component must be connected between two different nodes.");
                return;
            }
            
            addComponent(type, n1, n2, val);
        }

        function clearCircuit() {
            simState.components = [];
            simState.fgNode = null;
            simState.croNode = null;
            simState.groundNodes = [];
            rebuildAllMeshes();
            updateUIList();
        }

        function updateUIList() {
            const list = document.getElementById('component-list');
            list.innerHTML = '';
            
            const createItem = (title, desc, onRemove) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-800/80 p-2 rounded text-xs border border-slate-700";
                div.innerHTML = `<div><strong class="text-white">${title}</strong><br><span class="text-slate-400">${desc}</span></div>
                                 <button class="text-red-400 hover:text-red-300 px-2 py-1 font-bold">X</button>`;
                div.querySelector('button').onclick = onRemove;
                list.appendChild(div);
            };

            if (simState.fgNode) createItem("Function Gen", `Connected to Row ${simState.fgNode}`, () => removeComponent('fg', 'fg', simState.fgNode));
            if (simState.croNode) createItem("CRO Probe", `Connected to Row ${simState.croNode}`, () => removeComponent('cro', 'cro', simState.croNode));
            simState.groundNodes.forEach(n => createItem("Ground", `Connected to Row ${n}`, () => removeComponent('gnd', 'gnd', n)));
            
            simState.components.forEach(c => {
                let title = c.type.toUpperCase();
                let desc = `Rows ${c.n1} ⟷ ${c.n2}`;
                if (c.type === 'resistor') desc += ` | ${c.value}Ω`;
                if (c.type === 'capacitor') desc += ` | ${c.value * 1000000}µF`;
                createItem(title, desc, () => removeComponent(c.id, c.type, c.n1));
            });
        }

        // --- Demo Circuits ---
        function loadDemoCircuit(type) {
            clearCircuit();
            if (type === 'rc') {
                // RC Low Pass Filter
                simState.frequency = 1000;
                simState.timePerDiv = 0.2;
                document.getElementById('freq-slider').value = 1000;
                document.getElementById('freq-val').innerText = '1000 Hz';
                
                addComponent('fg', 1);             // Inject signal at row 1
                addComponent('resistor', 1, 2, 1000); // 1k ohm resistor row 1 to 2
                addComponent('capacitor', 2, 12, 0.0000001); // 0.1uF cap row 2 to 12
                addComponent('gnd', 12);           // Ground row 12
                addComponent('cro', 2);            // Measure at row 2 (between R and C)
            } 
            else if (type === 'clipper') {
                // Diode Clipper
                simState.frequency = 100;
                simState.amplitude = 10;
                simState.timePerDiv = 2.0;
                document.getElementById('freq-slider').value = 100;
                document.getElementById('amp-slider').value = 10;
                
                addComponent('fg', 1);
                addComponent('resistor', 1, 2, 1000); // 1k series
                addComponent('diode', 2, 12);         // Diode pointing to ground
                addComponent('gnd', 12);
                addComponent('cro', 2);               // Measure clipped voltage
            }
        }

        // --- Resize & Animation Loop ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            
            // Update Scope Screen
            updateCROScreen(dt);
            croScreenTexture.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Init
        bbGroup.updateMatrixWorld(); // Ensure world coordinates are ready for component placement
        loadDemoCircuit('rc');
        animate();

    </script>
</body>
</html>
